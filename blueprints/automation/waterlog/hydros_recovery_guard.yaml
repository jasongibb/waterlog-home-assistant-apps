blueprint:
  name: HA-Hydros sustained-outage recovery guard
  description: >-
    Reload HA-Hydros once when every watched entity has remained unavailable
    for the configured duration. Select at least one dependable entity from
    each collective. The cooldown serializes recovery, and a continuous outage
    cannot create a reload loop. This is a household workaround, not a
    life-support control or alert path.
  domain: automation
  author: Waterlog
  homeassistant:
    min_version: 2024.10.0
  input:
    watched_entities:
      name: HA-Hydros entities to watch
      description: >-
        Select at least one dependable entity from every HYDROS collective.
        Recovery starts only when all selected entities are unavailable.
      selector:
        entity:
          multiple: true
          filter:
            integration: hydros
    outage_duration:
      name: Sustained outage duration
      description: All selected entities must remain unavailable this long.
      default:
        minutes: 3
      selector:
        duration:
    cooldown:
      name: Recovery cooldown
      description: Ignore additional triggers for this long after a reload.
      default:
        minutes: 10
      selector:
        duration:

trigger_variables:
  watched_entities: !input watched_entities

triggers:
  - trigger: template
    value_template: >-
      {% set selected = expand(watched_entities) %}
      {% set failed = selected
        | selectattr('state', 'eq', 'unavailable')
        | list %}
      {{ (watched_entities | count) > 0
        and (selected | count) == (watched_entities | count)
        and (failed | count) == (selected | count) }}
    for: !input outage_duration

actions:
  - action: homeassistant.reload_config_entry
    target:
      entity_id: !input watched_entities
  - delay: !input cooldown

mode: single
max_exceeded: silent
