name: Waterlog Bridge
version: "0.2.0"
slug: waterlog_bridge
description: Send configured Home Assistant sensor readings to Waterlog safely.
url: https://github.com/jasongibb/waterlog-home-assistant-apps/tree/main/waterlog-bridge
image: ghcr.io/jasongibb/waterlog-home-assistant-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
options:
  waterlog_url: https://waterlog.fish
  waterlog_credential: null
  streams: []
  hydros_provider_key: null
  hydros_devices: []
  hydros_streams: []
  upload_interval_seconds: 1800
  batch_size: 250
  request_timeout_seconds: 20
  queue_retention_days: 30
  max_queue_items: 100000
  allow_insecure_http: false
  log_level: INFO
schema:
  waterlog_url: url
  waterlog_credential: password
  streams:
    - stream_id: str
      entity_id: str
      unit_override: "str?"
  hydros_provider_key: "password?"
  hydros_devices:
    - name: str
      device_key: password
  hydros_streams:
    - stream_id: str
      device: str
      input: str
      value_field: "str?"
      unit: str
  upload_interval_seconds: "int(300,7200)"
  batch_size: "int(1,500)"
  request_timeout_seconds: "int(5,60)"
  queue_retention_days: "int(1,30)"
  max_queue_items: "int(1000,500000)"
  allow_insecure_http: bool
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
